// Disable JAR tasks in the root project (after evaluation)
afterEvaluate {
    if (project == rootProject) {
        tasks.withType(AbstractArchiveTask).configureEach { task ->
            if (task.name in ["jar", "remapJar"]) {
                task.enabled = false
            }
        }
    }
}

