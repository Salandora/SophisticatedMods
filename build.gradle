import net.fabricmc.loom.task.prod.ClientProductionRunTask
import net.fabricmc.loom.task.prod.ServerProductionRunTask

plugins {
    id 'idea'
    id "java"
    id "java-library"
    id 'fabric-loom' version '1.10.+' apply false
}

def debugArgs = [
    "-enableassertions",
    "-Dmixin.debug.verify=true",
    //"-Dmixin.debug.strict=true",
    "-Dmixin.debug.countInjections=true",
    "-XX:+AllowEnhancedClassRedefinition"
]

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

repositories {
    mavenLocal()
    mavenCentral()

    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }

    maven { // FAPI, Loader
        url = "https://maven.fabricmc.net/"
        content {
            excludeGroup "net.fabricmc.fabric-api"
        }
    }
    maven { url = "https://maven.quiltmc.org/repository/release" } // QM

    maven { // placeholder api for ModMenu
        name = "Nucleoid"
        url = "https://maven.nucleoid.xyz/"
    }
    maven { url = "https://maven.terraformersmc.com/" } // ModMenu, Emi
    maven { url = "https://maven.shedaniel.me/" } // REI and deps
    maven { url = "https://modmaven.dev" } // Jei
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name "CurseForge"
                url "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }
    maven { url = "https://maven.ladysnake.org/releases" } // CCA, for Trinkets
    maven { url = 'https://maven.wispforest.io/releases' } // Accessories
}

allprojects {
    apply plugin: "fabric-loom"
}

configurations {
    productionMods {
        transitive = false
    }
}

configurations.configureEach {
    resolutionStrategy {
        force "net.fabricmc:fabric-loader:$project.loader_version"
        force "net.fabricmc.fabric-api:fabric-api:$project.fabric_version"
    }
}

dependencies {
    minecraft("com.mojang:minecraft:$project.minecraft_version")
    mappings(loom.layered {
        it.officialMojangMappings()
        it.parchment("org.parchmentmc.data:parchment-${project.parchment_version}@zip")
    })

    modImplementation("net.fabricmc:fabric-loader:$project.loader_version")
    modImplementation("net.fabricmc.fabric-api:fabric-api:$project.fabric_version")
    productionMods("net.fabricmc.fabric-api:fabric-api:$project.fabric_version")

    implementation("javax.annotation:javax.annotation-api:1.3.2")
    implementation("com.google.code.findbugs:jsr305:3.0.2")

    modLocalRuntime("me.shedaniel.cloth:cloth-config-fabric:$project.cloth_config_version")

    modLocalRuntime("com.terraformersmc:modmenu:$project.modmenu_version")
    productionMods("com.terraformersmc:modmenu:$project.modmenu_version")

    modLocalRuntime("maven.modrinth:sodium:$project.sodium_version")

    modLocalRuntime("curse.maven:jade-324717:${project.jade_version}")

    modLocalRuntime("maven.modrinth:toms-storage:${project.toms_storage_version}")
    modLocalRuntime("org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cca_version}")
    modLocalRuntime("org.ladysnake.cardinal-components-api:cardinal-components-block:${project.cca_version}")

    modLocalRuntime("maven.modrinth:admiral:${project.admiral_version}")
    modLocalRuntime("maven.modrinth:simple-voice-chat:${project.simple_voice_chat_version}")
    modLocalRuntime("maven.modrinth:audioplayer:${project.audioplayer_version}")

    modLocalRuntime("curse.maven:open-parties-and-claims-636608:6242911")

    /*modLocalRuntime("curse.maven:legendary-tooltips-fabric-542478:6400658")
    modLocalRuntime("curse.maven:iceberg-fabric-539382:6375475")
    modLocalRuntime("curse.maven:prism-fabric-665526:6372978")*/

    // modLocalRuntime("maven.modrinth:puzzles-lib:v21.1.33-1.21.1-Fabric")

    switch (accessory_mod.toLowerCase(Locale.ROOT)) {
        case "trinkets": modLocalRuntime("dev.emi:trinkets:$project.trinkets_version"); logger.lifecycle("Trinkets loaded"); break
        case "accessories":
            modLocalRuntime("io.wispforest:accessories-fabric:${project.accessories_version}")
            modLocalRuntime("maven.modrinth:accessories-tc-layer:${project.accessories_tclayer_version}")
            modLocalRuntime("org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cca_version}")
            modLocalRuntime("org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cca_version}")
            logger.lifecycle("Accessories loaded"); break
    }

    switch (recipe_viewer.toLowerCase(Locale.ROOT)) {
        case "emi": modLocalRuntime("dev.emi:emi-fabric:$project.emi_version"); logger.lifecycle("EMI loaded"); break
        case "jei": modLocalRuntime("mezz.jei:jei-$project.minecraft_version-fabric:$project.jei_version"); logger.lifecycle("JEI loaded"); break
        case "rei": modLocalRuntime("me.shedaniel:RoughlyEnoughItems-fabric:$project.rei_version"); logger.lifecycle("REI loaded"); break
        case "disabled": break
        default: logger.lifecycle("Unknown recipe viewer specified: $project.recipe_viewer. Must be JEI, REI, EMI, or disabled.")
    }
}

loom {
    runtimeOnlyLog4j = true

    mixin {
        useLegacyMixinAp = false
    }

    runs {
        client {
            client()

            configName = "Minecraft Client ${project.minecraft_version}"
            runDir "run/${project.minecraft_version}/client"

            programArg("--username Dev") // set a fixed username for the client
            if (System.getenv("HOTSWAP_AGENT") != null) {
                property("fabric.systemLibraries=" + System.getenv("HOTSWAP_AGENT"))
                vmArg("--add-exports=java.base/sun.nio.ch=ALL-UNNAMED")
                vmArg("--add-opens=java.base/java.lang=ALL-UNNAMED")
                vmArg("--add-opens=java.base/java.lang.reflect=ALL-UNNAMED")
                vmArg("--add-opens=java.base/java.io=ALL-UNNAMED")
                vmArg("--add-opens=java.desktop/java.beans=ALL-UNNAMED")
                vmArg("--add-exports=jdk.unsupported/sun.misc=ALL-UNNAMED")
            }

            try {
                afterEvaluate {
                    def mixinDep = this.configurations.compileClasspath.incoming.artifactView {
                        componentFilter {
                            it instanceof ModuleComponentIdentifier
                                    && it.module == "sponge-mixin"
                        }
                    }

                    if (mixin != null) {
                        vmArg("-javaagent:${mixinDep.files.first().path}")
                        println("[Info]: Mixin Hotswap setup finished")
                    } else {
                        println("[Warning]: Unable to locate file path for Mixin jar")
                    }
                }
            } catch (Exception e) {
                println("[Error]: Mixin Hotswap setup failed!")
                e.printStackTrace()
            }
        }
        client2 {
            client()

            configName = "Minecraft Client2 ${project.minecraft_version}"
            runDir "run/${project.minecraft_version}/client2"

            programArg("--username Dev2") // set a fixed username for the client
            if (System.getenv("HOTSWAP_AGENT") != null) {
                property("fabric.systemLibraries=" + System.getenv("HOTSWAP_AGENT"))
                vmArg("--add-exports=java.base/sun.nio.ch=ALL-UNNAMED")
                vmArg("--add-opens=java.base/java.lang=ALL-UNNAMED")
                vmArg("--add-opens=java.base/java.lang.reflect=ALL-UNNAMED")
                vmArg("--add-opens=java.base/java.io=ALL-UNNAMED")
                vmArg("--add-opens=java.desktop/java.beans=ALL-UNNAMED")
                vmArg("--add-exports=jdk.unsupported/sun.misc=ALL-UNNAMED")
            }

            try {
                afterEvaluate {
                    def mixinDep = this.configurations.compileClasspath.incoming.artifactView {
                        componentFilter {
                            it instanceof ModuleComponentIdentifier
                                    && it.module == "sponge-mixin"
                        }
                    }

                    if (mixin != null) {
                        vmArg("-javaagent:${mixinDep.files.first().path}")
                        println("[Info]: Mixin Hotswap setup finished")
                    } else {
                        println("[Warning]: Unable to locate file path for Mixin jar")
                    }
                }
            } catch (Exception e) {
                println("[Error]: Mixin Hotswap setup failed!")
                e.printStackTrace()
            }
        }

        server {
            server()

            configName = "Minecraft Server ${project.minecraft_version}"
            runDir "run/${project.minecraft_version}/server"
        }
    }

    runs.configureEach {
        vmArgs(debugArgs)
    }
}

subprojects {
    afterEvaluate {
        loom.runs {
            datagen {
                ideConfigGenerated = true
            }
        }
    }
}

subprojects.each { p ->
    dependencies {
        implementation project(path: "${p.path}", configuration: "namedElements")
    }

    loom.mods.register(p.name) {
        sourceSet p.sourceSets.main
    }

    remapJar.dependsOn("${p.path}:remapJar")
}

tasks.register("fixIntelliJResources") {
    group = 'fabric'
}

dependencies {
    subprojects.each {
        api project(path: "${it.path}", configuration: "namedElements")

        productionMods project(":${it.name}")
    }
}

def productionMods = project.files(configurations.productionMods)

tasks.register('runProductionClient', ClientProductionRunTask) {
    runDir.set(project.layout.getProjectDirectory().dir("run").dir("${project.minecraft_version}_production").dir("client"))

    mods.setFrom productionMods
    jvmArgs.addAll(debugArgs)
}

tasks.register('runProductionServer', ServerProductionRunTask) {
    runDir.set(project.layout.getProjectDirectory().dir("run").dir("${project.minecraft_version}_production").dir("server"))

    mods.setFrom productionMods
    jvmArgs.addAll(debugArgs)
    programArgs.add("nogui")
}
