import net.fabricmc.loom.task.RemapJarTask
import net.fabricmc.loom.task.prod.ClientProductionRunTask
import net.fabricmc.loom.task.prod.ServerProductionRunTask

plugins {
    id 'idea'
    id "java"
    id "java-library"
    id 'fabric-loom' version '1.15.+' apply false
}

def debugArgs = [
    //"-enableassertions",
    "-Dmixin.debug.verify=true",
    //"-Dmixin.debug.strict=true",
    //"-Dmixin.debug.countInjections=true",
    "-XX:+AllowEnhancedClassRedefinition"
]

idea {
    module {
        downloadJavadoc = true
        // downloadSources = true
    }
}

repositories {
    mavenLocal()
    mavenCentral()

    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }

    maven { // FAPI, Loader
        url = "https://maven.fabricmc.net/"
    }
    maven { url = "https://maven.quiltmc.org/repository/release" } // QM

    maven { // placeholder api for ModMenu
        name = "Nucleoid"
        url = "https://maven.nucleoid.xyz/"
    }
    maven { url = "https://maven.terraformersmc.com/" } // ModMenu, Emi
    maven { url = "https://maven.shedaniel.me/" } // REI and deps
    maven { url = "https://modmaven.dev" } // Jei
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "CurseForge"
                url = "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
    maven { url = "https://maven.ladysnake.org/releases" } // CCA, for Trinkets
    maven { url = "https://maven.wispforest.io/releases" } // Accessories

    maven { url = "https://mvn.devos.one/releases" } // Create, Porting Lib
    maven { url = "https://mvn.devos.one/snapshots" } // Porting Lib
    maven {
        url = "https://maven.createmod.net"
        content {
            includeGroupByRegex "net.createmod.*"
            includeGroupByRegex "dev.engine-room.*"
        }
    }

    maven { // Reach Entity Attributes
        url = "https://maven.jamieswhiteshirt.com/libs-release"
        content {
            includeGroup "com.jamieswhiteshirt"
        }
    }
    maven {
        name 'Xander Maven'
        url 'https://maven.isxander.dev/releases'
        content {
            includeGroup "dev.isxander"
        }
    }
    maven {
        url "https://maven.twelveiterations.com/repository/maven-public/"
        content {
            includeGroup "net.blay09.mods"
        }
    }
}

allprojects {
    apply plugin: "fabric-loom"

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = 'UTF-8'
        it.options.release = 17
        javaCompiler = javaToolchains.compilerFor {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        toolchain.languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    productionMods {
        transitive = false
    }
}

configurations.configureEach {
    resolutionStrategy {
        force "net.fabricmc:fabric-loader:$project.loader_version"
        force "net.fabricmc.fabric-api:fabric-api:$project.fabric_version"
    }
}

