loom {
    runtimeOnlyLog4j = true

    mixin {
        useLegacyMixinAp = false
    }

    runs {
        def configureClientRun = { run, username ->
            run.client()
            run.configName = "Minecraft ${run.name.capitalize()} ${project.minecraft_version}"
            run.runDir = "run/${project.minecraft_version}/${run.name}"
            run.programArg("--username $username")

            // Common HOTSWAP_AGENT configuration
            if (System.getenv("HOTSWAP_AGENT")) {
                run.property("fabric.systemLibraries", System.getenv("HOTSWAP_AGENT"))
                [
                        "--add-exports=java.base/sun.nio.ch=ALL-UNNAMED",
                        "--add-opens=java.base/java.lang=ALL-UNNAMED",
                        "--add-opens=java.base/java.lang.reflect=ALL-UNNAMED",
                        "--add-opens=java.base/java.io=ALL-UNNAMED",
                        "--add-opens=java.desktop/java.beans=ALL-UNNAMED",
                        "--add-exports=jdk.unsupported/sun.misc=ALL-UNNAMED"
                ].each { arg -> run.vmArg(arg) }
            }

            // Common mixin configuration
            afterEvaluate {
                def mixinDep = configurations.compileClasspath.incoming.artifactView {
                    componentFilter { id ->
                        id instanceof ModuleComponentIdentifier && id.module == "sponge-mixin"
                    }
                }.files.find()

                if (mixinDep) {
                    run.vmArg("-javaagent:${mixinDep.path}")
                    println("[Info]: Mixin Hotswap setup finished for ${run.name}")
                } else {
                    println("[Warning]: Missing Mixin dependency for ${run.name}")
                }
            }
        }

        client { configureClientRun(it, "Dev") }
        client2 { configureClientRun(it, "Dev2") }

        server {
            server()

            configName = "Minecraft Server ${project.minecraft_version}"
            runDir "run/${project.minecraft_version}/server"
        }
    }

    runs.configureEach {
        vmArgs(debugArgs)
    }
}

subprojects {
    afterEvaluate {
        loom.runs.findByName("datagen")?.setIdeConfigGenerated(true)

        tasks.named('remapJar', RemapJarTask) { // Targets the Fabric Loom task
            // Set output directory to root project's "output" folder
            destinationDirectory.set(rootProject.layout.buildDirectory.dir("libs"))
        }
    }
}

subprojects.each { p ->
    dependencies {
        implementation project(path: "${p.path}", configuration: "namedElements")
    }

    loom.mods.register(p.name) {
        sourceSet p.sourceSets.main
    }
}

// Disable JAR tasks in the root project (after evaluation)
afterEvaluate {
    if (project == rootProject) {
        tasks.withType(AbstractArchiveTask).configureEach { task ->
            if (task.name in ["jar", "remapJar"]) {
                task.enabled = false
            }
        }
    }
}

tasks.register("fixIntelliJResources") {
    group = 'fabric'
}

dependencies {
    subprojects.each {
        api project(path: "${it.path}", configuration: "namedElements")

        productionMods project(":${it.name}")
    }
}

def productionMods = project.files(configurations.productionMods, configurations.modImplementation, configurations.modLocalRuntime)
tasks.register('runProductionClient', ClientProductionRunTask) {
    runDir.set(project.layout.getProjectDirectory().dir("run").dir("${project.minecraft_version}_production").dir("client"))

    mods.setFrom productionMods
    jvmArgs.addAll(debugArgs)
}

tasks.register('runProductionServer', ServerProductionRunTask) {
    runDir.set(project.layout.getProjectDirectory().dir("run").dir("${project.minecraft_version}_production").dir("server"))

    mods.setFrom productionMods
    jvmArgs.addAll(debugArgs)
    programArgs.add("nogui")
}

tasks.register('generateChangelog') {
    doLast {
        subprojects.each {
            def projectMessage = "# " + it.name + " #"
            println("#".repeat(projectMessage.length()))
            println(projectMessage)
            println("#".repeat(projectMessage.length()))
            println(it.ext.changelog)
        }
    }

    dependsOn subprojects.collect( subproject -> {
        subproject.tasks.named("generateChangelog").get()
    })
}

// Run configuration hack to add a before run task
tasks.register('injectIntellijBeforeRun') {
    group = 'ide'
    description = 'Inject Gradle.BeforeRunTask into IntelliJ run configurations'

    onlyIf {
        // Only run if IDEA sync has created configurations
        file(".idea/runConfigurations").exists()
    }

    doLast {
        def runNames = loom.runs.collect { it.configName.replace(' ', '_').replace('.', '_') }
        file(".idea/runConfigurations").eachFile { configFile ->
            try {
                if (!runNames.contains(configFile.name.replace('.xml', ''))) {
                    return
                }

                def xml = new groovy.xml.XmlParser().parse(configFile)
                xml.each { config ->
                    if (config.@type == 'Application' && config.@factoryName == 'Application') {
                        def method = config.find { it.@v == "2" } ?: config.appendNode('method', [v: "2"])

                        if (!method.find { it.@name == 'Gradle.BeforeRunTask' }) {
                            method.appendNode('option', [
                                    name               : 'Gradle.BeforeRunTask',
                                    enabled            : 'true',
                                    tasks              : 'fixIntelliJResources',
                                    externalProjectPath: '$PROJECT_DIR$'
                            ])

                            // Write modified XML back
                            def writer = new StringWriter()
                            new groovy.xml.XmlNodePrinter(new PrintWriter(writer)).print(xml)
                            configFile.text = writer.toString()
                        }
                    }
                }
            } catch (Exception e) {
                logger.warn("Failed to process ${configFile.name}: ${e.message}")
            }
        }
    }
}
tasks.findByName('ideaSyncTask')?.finalizedBy(tasks.named('injectIntellijBeforeRun'))